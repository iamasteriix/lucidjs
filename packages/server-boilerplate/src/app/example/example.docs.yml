/:
  get:
    summary: Timestamped welcome message
    tags:
      - Examples
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: rocketship, rocketship
                time:
                  type: string
                  format: date-time